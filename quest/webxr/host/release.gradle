// Generated host applies this after its browser Gradle configuration.
def keyProperties = new Properties()
def questKeys = rootProject.file('../../../quest/keystore.properties')
def androidKeys = rootProject.file('../../../android/keystore.properties')
def keyFile = questKeys.exists() ? questKeys : androidKeys
if (keyFile.exists()) keyFile.withInputStream { keyProperties.load(it) }
def keyValues = [:]
[storeFile:'STORE_FILE', storePassword:'STORE_PASSWORD', keyAlias:'KEY_ALIAS', keyPassword:'KEY_PASSWORD'].each { key, suffix ->
    keyValues[key] = System.getenv('NH3D_QUEST_' + suffix) ?: System.getenv('NH3D_ANDROID_' + suffix) ?: keyProperties.getProperty(key)
}
def ready = keyValues.values().every { it != null && !it.trim().isEmpty() }
def store = keyValues.storeFile ? new File(keyValues.storeFile) : null
if (store != null && !store.isAbsolute()) store = new File(keyFile.parentFile, keyValues.storeFile)
android.signingConfigs {
    nh3dRelease {
        if (ready) {
            storeFile store
            storePassword keyValues.storePassword
            keyAlias keyValues.keyAlias
            keyPassword keyValues.keyPassword
        }
    }
}
android.buildTypes.release {
    debuggable false
    // Retain JNI/reflection behavior of the tested host; optimizing native code
    // does not require enabling the browser's unvalidated R8 shrinking rules.
    minifyEnabled false
    shrinkResources false
    signingConfig android.signingConfigs.nh3dRelease
}
tasks.register('validateNh3dReleaseSigning') {
    doLast {
        if (!ready || !store.isFile()) throw new GradleException('Configure quest/keystore.properties (or android/keystore.properties), or NH3D_QUEST_STORE_FILE, NH3D_QUEST_STORE_PASSWORD, NH3D_QUEST_KEY_ALIAS, NH3D_QUEST_KEY_PASSWORD before building a store APK. Do not use the Android debug key.')
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('validateSigning') && task.name.endsWith('Release')) task.dependsOn('validateNh3dReleaseSigning')
}
