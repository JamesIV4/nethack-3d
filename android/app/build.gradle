apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def rootPackage = new JsonSlurper().parse(file('../../package.json'))
def packageVersion = rootPackage.version ?: "0.0.0"
apply from: '../../scripts/android/signing-properties.gradle'
def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = loadNh3dSigningProperties(signingPropertiesFile)
def signingValues = [
    storeFile: System.getenv('NH3D_ANDROID_STORE_FILE') ?: signingProperties.getProperty('storeFile'),
    storePassword: System.getenv('NH3D_ANDROID_STORE_PASSWORD') ?: signingProperties.getProperty('storePassword'),
    keyAlias: System.getenv('NH3D_ANDROID_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias'),
    keyPassword: System.getenv('NH3D_ANDROID_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')
]
def signingReady = signingValues.values().every { it != null && !it.isEmpty() }

tasks.register('validateReleaseSigning') {
    doLast {
        if (!signingReady) {
            throw new GradleException('Release signing is missing. Configure android/keystore.properties using keystore.properties.example, or set NH3D_ANDROID_STORE_FILE, NH3D_ANDROID_STORE_PASSWORD, NH3D_ANDROID_KEY_ALIAS and NH3D_ANDROID_KEY_PASSWORD.')
        }
        if (!rootProject.file(signingValues.storeFile).isFile()) {
            throw new GradleException('Release keystore file does not exist. Check storeFile in android/keystore.properties.')
        }
    }
}

android {
    namespace = "com.nethack3d.app"
    signingConfigs {
        release {
            if (signingReady) {
                storeFile rootProject.file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nethack3d.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName packageVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.configureEach { output ->
                output.outputFileName = "NetHack 3D ${variant.versionName}.apk"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
